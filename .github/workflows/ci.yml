name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: secretpassword
        options: >-
          --health-cmd "mongosh --quiet -u admin -p secretpassword --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./...
      - name: Integration tests
        env:
          MONGO_URI: mongodb://localhost:27017/?directConnection=true
        run: go test -tags=integration -count=1 ./internal/repository/mongodb/...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start MongoDB and the API
        run: docker compose up --build -d --wait mongodb api
      - name: Seed the data
        run: make seed
      - name: API tests over HTTP
        run: go test -tags=e2e -count=1 ./test/e2e/...
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs api mongodb
