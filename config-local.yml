system:
  host: "0.0.0.0"
  port: 8082
  name: "bite-express"
  version: "1.0"
  description: "POC"
  tenantId: "biteexpress"
  timezone: "UTC"
cache:
  enabled: true
  type: "memory" # other types (e.g. redis) are not supported yet
  config:
    ttl: 60 # seconds an entry stays valid
    maxEntries: 1000 # list/search results; by-id entries allowed: 10x this
repository:
  providers:
    - name: "mongodb"
      enabled: true
      connection:
        uri: mongodb://localhost:27017/?directConnection=true
        dbName: biteexpress
        authSource: "admin"
        username: "admin"
        password: "secretpassword"
      modules:
        - restaurants