system:
  host: "0.0.0.0"
  port: 8082
  name: "bite-express"
  version: "1.0"
  description: "POC"
  tenantId: "biteexpress"
  timezone: "UTC"
cache:
  enabled: false
  type: "redis"
  config:
    host: "redis-container"
    port: 6379
    password: ""
    db: 2
    ttl: 300 # Time to live in seconds (300seconds = 5 minutes)
repository:
  providers:
    - name: "mongodb"
      enabled: true
      connection:
        uri: mongodb://localhost:27017/?directConnection=true
        dbName: biteexpress
        authSource: "admin"
        username: "admin"
        password: "secretpassword"
      modules:
        - restaurants